<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outbox Offline · PWA</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 1rem; background:#f1f5f9; color:#0f172a; }
    h1 { font-size: 1.4rem; }
    .estado { padding: .4rem .8rem; border-radius: 999px; display:inline-block; font-weight:600; font-size:.85rem; }
    .online { background:#dcfce7; color:#166534; } .offline { background:#fee2e2; color:#991b1b; }
    form, section { background:#fff; padding:1rem; border-radius:12px; margin:1rem 0; box-shadow:0 1px 3px #0001; }
    input, textarea { width:100%; box-sizing:border-box; padding:.5rem; margin:.3rem 0 .8rem; border:1px solid #cbd5e1; border-radius:8px; font:inherit; }
    button { padding:.55rem 1rem; border:0; border-radius:8px; background:#1e3a8a; color:#fff; font-weight:600; cursor:pointer; margin-right:.4rem; }
    button.sec { background:#64748b; } button.peligro { background:#b91c1c; }
    ul { list-style:none; padding:0; } li { border-bottom:1px solid #e2e8f0; padding:.5rem 0; display:flex; justify-content:space-between; gap:.5rem; }
    #log { font-size:.85rem; color:#334155; white-space:pre-line; }
  </style>
</head>
<body>
  <h1>📮 Outbox Offline (IndexedDB + Background Sync)</h1>
  <p>Conexión: <span id="estadoRed" class="estado">…</span> · Sync: <span id="soporteSync"></span></p>

  <form id="formulario">
    <label>Título <input id="titulo" required></label>
    <label>Mensaje <textarea id="cuerpo" rows="3" required></textarea></label>
    <button type="submit">Enviar (POST)</button>
  </form>

  <section>
    <h2>Bandeja de salida (pendientes: <span id="contador">0</span>)</h2>
    <ul id="lista"></ul>
    <button id="btnSync" class="sec">Sincronizar ahora</button>
    <button id="btnPurgar" class="peligro">Purgar bandeja</button>
  </section>

  <section>
    <h2>Registro</h2>
    <div id="log"></div>
  </section>

  <script src="./db-helper.js"></script>
  <script src="./app.js"></script>
</body>
</html>
